name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  claude:
    # ROOT-01: issue_comment payloads expose the PR only as
    # github.event.issue.pull_request (an API URL object), so the fork flag is
    # verified by the "Verify pull request source" step below for that event.
    # pull_request_review(_comment) payloads carry the pull_request object, so
    # head.repo.fork can be checked directly here.
    if: |
      github.actor == 'sven-n' && (
        (github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment'
          && github.event.pull_request.head.repo.fork == false
          && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review'
          && github.event.pull_request.head.repo.fork == false
          && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Verify pull request source (issue comments)
        # An issue_comment on a PR cannot report fork status in the event
        # payload; resolve the associated PR via API and refuse forked heads.
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api_url="${{ github.event.issue.pull_request.url }}"
          fork="$(gh api "$api_url" --jq '.head.repo.fork')"
          if [ "$fork" != "false" ]; then
            echo "Refusing to run: associated pull request comes from a fork."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@1bc23c05956f182d538474fec6c62d9c830b47e9 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
