plugins {
    id 'com.android.application'
}

// A-06: same strict address policy as game-app and Build-AndroidPackage.ps1.
static boolean isValidServerAddress(String value) {
    if (value == null || value.isEmpty()) return false
    if (value ==~ /^\d{1,3}(\.\d{1,3}){3}$/) {
        for (String octet : value.split('\\.')) {
            if (octet.length() > 1 && octet.startsWith('0')) return false
            int n = Integer.parseInt(octet)
            if (n < 0 || n > 255) return false
        }
        return true
    }
    if (value.endsWith('.')) return false
    for (String label : value.split('\\.')) {
        if (label.isEmpty() || label.length() > 63) return false
        if (!(label ==~ /[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?/)) return false
    }
    return true
}

// No default: a hardcoded LAN address here would silently bake one developer's
// IP into any APK built by hand with `gradlew assembleDebug`. Fail instead, the
// way the package key below does. Build-AndroidPackage.ps1 passes this with
// -POPENMU_SERVER_ADDRESS=<ip or hostname>.
def openMuServerAddress = providers.gradleProperty('OPENMU_SERVER_ADDRESS').getOrElse('')
if (!isValidServerAddress(openMuServerAddress)) {
    throw new GradleException('OPENMU_SERVER_ADDRESS must be a valid IPv4 address or ' +
        'hostname (no empty labels, no leading/trailing hyphens, no leading-zero ' +
        'octets). Pass it with -POPENMU_SERVER_ADDRESS=<address>.')
}
def mobilePackageKey = providers.gradleProperty('OPENMU_MOBILE_PACKAGE_KEY').getOrElse('')
if (!(mobilePackageKey ==~ /[A-Za-z0-9_-]{43}/)) {
    throw new GradleException('OPENMU_MOBILE_PACKAGE_KEY must be exactly 43 base64url characters')
}
// A-04: the GM bearer must ride HTTPS by default. The bundled LAN sideload
// delivery passes -POPENMU_SERVER_SCHEME=http explicitly; a hand release build
// defaults to https:// so the key is never sent in cleartext by accident.
def openMuServerScheme = providers.gradleProperty('OPENMU_SERVER_SCHEME').getOrElse('https')
if (!(openMuServerScheme ==~ /https?/)) {
    throw new GradleException('OPENMU_SERVER_SCHEME must be "http" or "https".')
}

android {
    namespace 'net.munique.openmu.gm'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'net.munique.openmu.gm'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'DEFAULT_SERVER_URL', '"' + openMuServerScheme + '://' + openMuServerAddress + ':5080"'
        buildConfigField 'String', 'MOBILE_PACKAGE_KEY', '"' + mobilePackageKey + '"'
    }

    buildFeatures {
        buildConfig true
    }

    // A-03: release signing material is never checked in (see game-app for the
    // keystore.properties / env convention).
    signingConfigs {
        release {
            def ksFile = rootProject.file('keystore.properties')
            if (ksFile.isFile()) {
                def ksProps = new Properties()
                ksFile.withInputStream { ksProps.load(it) }
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            } else if (System.getenv('OPENMU_ANDROID_KEYSTORE_FILE')) {
                storeFile file(System.getenv('OPENMU_ANDROID_KEYSTORE_FILE'))
                storePassword System.getenv('OPENMU_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('OPENMU_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('OPENMU_ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}