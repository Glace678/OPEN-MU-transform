plugins {
    id 'com.android.application'
}

// A-06: mirror the runtime LocalIpv4Address policy and Build-AndroidPackage.ps1:
// the old regex [A-Za-z0-9.-]+ accepted ".", "-", leading/trailing hyphens and
// leading-zero octets, so a hand build would succeed but bake an unusable default
// address into the APK. Reject empty labels, leading/trailing hyphens and
// leading-zero IPv4 octets.
static boolean isValidServerAddress(String value) {
    if (value == null || value.isEmpty()) return false
    if (value ==~ /^\d{1,3}(\.\d{1,3}){3}$/) {
        for (String octet : value.split('\\.')) {
            if (octet.length() > 1 && octet.startsWith('0')) return false
            int n = Integer.parseInt(octet)
            if (n < 0 || n > 255) return false
        }
        return true
    }
    if (value.endsWith('.')) return false
    for (String label : value.split('\\.')) {
        if (label.isEmpty() || label.length() > 63) return false
        if (!(label ==~ /[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?/)) return false
    }
    return true
}

// No default: a hardcoded LAN address here would silently bake one developer's
// IP into any APK built by hand with `gradlew assembleDebug`. Fail instead,
// the way the package key below does. Build-AndroidPackage.ps1 passes this with
// -POPENMU_SERVER_ADDRESS=<ip or hostname>.
def openMuServerAddress = providers.gradleProperty('OPENMU_SERVER_ADDRESS').getOrElse('')
if (!isValidServerAddress(openMuServerAddress)) {
    throw new GradleException('OPENMU_SERVER_ADDRESS must be a valid IPv4 address or ' +
        'hostname (no empty labels, no leading/trailing hyphens, no leading-zero ' +
        'octets). Pass it with -POPENMU_SERVER_ADDRESS=<address>.')
}
// 107-02: the login derivation seed. Distinct from the GM bearer token
// (gm-app uses OPENMU_MOBILE_GM_TOKEN). The server derives the identical
// local account from this value via HMAC-SHA256. Inject at build time only;
// never commit a real value.
def mobileLoginSeed = providers.gradleProperty('OPENMU_MOBILE_LOGIN_SEED').getOrElse('')
if (!(mobileLoginSeed ==~ /[A-Za-z0-9_-]{43}/)) {
    throw new GradleException('OPENMU_MOBILE_LOGIN_SEED must be exactly 43 base64url characters ' +
        '(the game login HMAC seed, distinct from OPENMU_MOBILE_GM_TOKEN).')
}
def gameDataArchive = file('src/main/assets/game-data.zip')
if (!gameDataArchive.isFile()) {
    throw new GradleException("Missing complete game data archive: ${gameDataArchive}")
}
def gameDataDigest = java.security.MessageDigest.getInstance('SHA-256')
gameDataArchive.withInputStream { input ->
    byte[] buffer = new byte[1024 * 1024]
    for (int count = input.read(buffer); count >= 0; count = input.read(buffer)) {
        if (count > 0) {
            gameDataDigest.update(buffer, 0, count)
        }
    }
}
def gameDataVersion = gameDataDigest.digest().collect { String.format('%02x', it & 0xff) }.join()

// NDK 路径不再硬编码到某台开发机：优先 -POPENMU_ANDROID_NDK_PATH，其次环境
// 变量 ANDROID_NDK_HOME / ANDROID_NDK_ROOT；都未设置时留给 AGP 按 ndkVersion
// 在 Android SDK 目录内自动解析（sdkmanager 安装的 NDK 即可被找到）。
def ndkPathOverride = providers.gradleProperty('OPENMU_ANDROID_NDK_PATH').getOrElse('')
if (!ndkPathOverride) {
    ndkPathOverride = System.getenv('ANDROID_NDK_HOME') ?: System.getenv('ANDROID_NDK_ROOT') ?: ''
}

android {
    namespace 'net.munique.openmu.game'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '27.2.12479018'
    if (ndkPathOverride) {
        ndkPath ndkPathOverride
    }

    defaultConfig {
        applicationId 'net.munique.openmu.game'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0-mobile-preview'
        buildConfigField 'String', 'GAME_DATA_VERSION', '"sha256:' + gameDataVersion + '"'
        buildConfigField 'String', 'DEFAULT_SERVER_ADDRESS', '"' + openMuServerAddress + '"'
        buildConfigField 'String', 'MOBILE_LOGIN_SEED', '"' + mobileLoginSeed + '"'

        ndk {
            abiFilters 'arm64-v8a'
        }

    }

    buildFeatures {
        buildConfig true
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    // A-03: release signing material is never checked in. Read it from a local
    // keystore.properties (gitignored) or OPENMU_ANDROID_KEYSTORE_* env vars.
    // Without it, assembleRelease fails loudly instead of silently producing an
    // unsigned / debug-signed release APK.
    signingConfigs {
        release {
            def ksFile = rootProject.file('keystore.properties')
            if (ksFile.isFile()) {
                def ksProps = new Properties()
                ksFile.withInputStream { ksProps.load(it) }
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            } else if (System.getenv('OPENMU_ANDROID_KEYSTORE_FILE')) {
                storeFile file(System.getenv('OPENMU_ANDROID_KEYSTORE_FILE'))
                storePassword System.getenv('OPENMU_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('OPENMU_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('OPENMU_ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main {
            java.srcDirs = [
                'src/main/java',
                '../../MuMain/src/ThirdParty/SDL/android-project/app/src/main/java'
            ]
            jniLibs.srcDirs = ['../native']
        }
    }

    androidResources {
        noCompress 'zip'
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        lintConfig file('lint.xml')
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}