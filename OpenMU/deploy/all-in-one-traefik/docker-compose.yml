services:
  openmu-startup:
    image: munique/openmu:0.9.10
    container_name: openmu-startup
    networks:
      - proxy
    ports:
      - "55901:55901"
      - "55902:55902"
      - "55903:55903"
      - "55904:55904"
      - "55905:55905"
      - "55906:55906"
      - "44405:44405"
      - "55980:55980"
    environment:
      DB_HOST: database
      # Bootstrap admin panel user. Compose refuses to start when it is unset or empty,
      # so the panel can never be reachable without a login (run deploy/quick-start first).
      OPENMU_ADMIN_USER: ${OPENMU_ADMIN_USER:?Run deploy/quick-start to create an admin user}
      OPENMU_ADMIN_PASSWORD: ${OPENMU_ADMIN_PASSWORD:?Run deploy/quick-start to create an admin user}
      # Optional base32 TOTP secret, if the bootstrap user should require a second factor.
      OPENMU_ADMIN_TOTP_SECRET: ${OPENMU_ADMIN_TOTP_SECRET:-}
      # Per-role database passwords injected from the environment (75-01).
      # ConnectionSettings.xml no longer stores plaintext passwords.
      OPENMU_DB_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      OPENMU_DB_CONFIG_PASSWORD: ${OPENMU_DB_CONFIG_PASSWORD:-${POSTGRES_PASSWORD}}
      OPENMU_DB_ACCOUNT_PASSWORD: ${OPENMU_DB_ACCOUNT_PASSWORD:-${POSTGRES_PASSWORD}}
      OPENMU_DB_FRIEND_PASSWORD: ${OPENMU_DB_FRIEND_PASSWORD:-${POSTGRES_PASSWORD}}
      OPENMU_DB_GUILD_PASSWORD: ${OPENMU_DB_GUILD_PASSWORD:-${POSTGRES_PASSWORD}}
      # website authenticates itself at the public API under /api.
    volumes:
      - adminpanel-keys:/app/data-protection-keys
    working_dir: /app/
    depends_on:
      - database
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.openmu.entrypoints=web"
      - "traefik.http.routers.openmu.rule=Host(`admin.docker.localhost`)"

  database:
    image: postgres:17-alpine
    container_name: database
    environment:
      # XC-15: no hardcoded password -- compose refuses to start when the
      # variable is unset or empty.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set it in .env or the environment)}
      POSTGRES_DB: openmu
      POSTGRES_USER: postgres
    networks:
      - proxy
    ports:
      # Never expose PostgreSQL to the public internet; keep it loopback-only.
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql #store data on volume

  socket-proxy:
    # Traefik needs read access to the container API for its docker provider. Mounting
    # /var/run/docker.sock directly into traefik grants root-equivalent API access; the
    # proxy exposes only the read-only endpoints Traefik actually uses.
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: "socket-proxy"
    restart: always
    environment:
      CONTAINERS: "1"
      SERVICES: "1"
      NETWORKS: "1"
      TASKS: "1"
      VERSION: "1"
      POST: "0"
      EXEC: "0"
      IMAGES: "0"
      VOLUMES: "0"
      SECRETS: "0"
      SYSTEM: "0"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - proxy

  traefik:
    image: traefik:2.11
    container_name: "traefik"
    restart: always
    command:
      - "--log.level=INFO"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    depends_on:
      - socket-proxy
    networks:
      - proxy

networks:
  proxy:
    external: true

volumes:
  adminpanel-keys:
  dbdata: