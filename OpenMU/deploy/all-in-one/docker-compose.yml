services:
  nginx-80:
    image: nginx:alpine
    container_name: nginx-80
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENMU_WEB_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - openmu-startup

  openmu-startup:
    image: munique/openmu
    container_name: openmu-startup
    restart: unless-stopped
    ports:
      - "${OPENMU_GAME_BIND:-127.0.0.1}:55901:55901"
      - "${OPENMU_GAME_BIND:-127.0.0.1}:55902:55902"
      - "${OPENMU_GAME_BIND:-127.0.0.1}:55903:55903"
      - "${OPENMU_GAME_BIND:-127.0.0.1}:55904:55904"
      - "${OPENMU_GAME_BIND:-127.0.0.1}:55905:55905"
      - "${OPENMU_GAME_BIND:-127.0.0.1}:55906:55906"
      - "${OPENMU_GAME_BIND:-127.0.0.1}:44405:44405"
      - "${OPENMU_GAME_BIND:-127.0.0.1}:44406:44406"
      - "${OPENMU_GAME_BIND:-127.0.0.1}:55980:55980"
    environment:
      DB_HOST: database
      DB_ADMIN_USER: ${DB_ADMIN_USER:-postgres}
      DB_ADMIN_PW: ${DB_ADMIN_PW:?Run deploy/quick-start to create local credentials}
      RESOLVE_IP: ${RESOLVE_IP:-127.0.0.1}
      OPENMU_BIND_ADDRESS: 0.0.0.0
      Database__AssumeExternallyProvisioned: "true"
      ASPNETCORE_URLS: http://+:8080
      # A bootstrap admin is mandatory for this deployment, including first startup.
      OPENMU_ADMIN_USER: ${OPENMU_ADMIN_USER:?Run deploy/quick-start to create an admin user}
      OPENMU_ADMIN_PASSWORD: ${OPENMU_ADMIN_PASSWORD:?Run deploy/quick-start to create local credentials}
      # Optional base32 TOTP secret, if the bootstrap user should require a second factor.
      OPENMU_ADMIN_TOTP_SECRET: ${OPENMU_ADMIN_TOTP_SECRET:-}
      # website authenticates itself at the public API under /api.
    volumes:
      - adminpanel-keys:/app/data-protection-keys
    working_dir: /app/
    depends_on:
      database:
        condition: service_healthy

  database:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    container_name: database
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_ADMIN_PW:?Run deploy/quick-start to create local credentials}
      # ConnectionSettings.xml uses openmu in every persistence context.
      POSTGRES_DB: openmu
      POSTGRES_USER: ${DB_ADMIN_USER:-postgres}
    volumes:
      - dbdata:/var/lib/postgresql #store data on volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  adminpanel-keys:
  dbdata:
