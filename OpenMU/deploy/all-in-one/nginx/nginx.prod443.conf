events {
}

http {
    # this is required to proxy Grafana Live WebSocket connections.
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }

    server {
        listen 443 default_server ssl http2;
        listen [::]:443 ssl http2;

        include conf.d/nginx.server_name.conf;
        include conf.d/nginx.prod.certificates.conf;

        # TLS hardening
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;

        resolver 127.0.0.11 ipv6=off;

        # Forward the original client IP, scheme (TLS is terminated here) and host so
        # the app's ForwardedHeaders middleware sees the request as HTTPS and returns
        # the Secure auth cookie.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        location / {
           proxy_pass http://openmu-startup:8080;
        }
    }
}