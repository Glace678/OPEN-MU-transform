# Optional public player self-service. Never publish the admin UI or Blazor hub.
services:
  player-portal:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      OPENMU_PORTAL_DOMAIN: ${OPENMU_PORTAL_DOMAIN:?Set a public DNS hostname with quick-start --portal-domain}
    volumes:
      - ./Caddyfile.portal:/etc/caddy/Caddyfile:ro
      - ../../src/Web/AdminPanel/wwwroot/player-portal:/srv:ro
      - portal-certificates:/data
      - portal-config:/config
    depends_on:
      - openmu-startup

volumes:
  portal-certificates:
  portal-config:
