volumes:
  adminpanel-keys:
  dbdata:
  prometheus-data:
  minio-data:

services:
  nginx-80:
    image: nginx:1.27-alpine
    container_name: nginx-80
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      grafana:
        condition: service_healthy
      zipkin:
        condition: service_started
      prometheus:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    volumes:
      - ./grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana_datasources.yaml:/etc/grafana/provisioning/datasources/ds.yaml:ro
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    ports:
      # Public access goes through nginx /grafana with basic auth; do not expose it directly.
      - "127.0.0.1::3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  prometheus:
    image: prom/prometheus:v2.53.4
    ports:
      - "127.0.0.1::9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command: --web.enable-lifecycle  --config.file=/etc/prometheus/prometheus.yml
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 6

  loki:
    image: grafana/loki:3.2.1
    container_name: loki
    command: "-config.file=/etc/loki/config.yaml -target=all"
    ports:
      - "127.0.0.1::3100"
      - "127.0.0.1::7946"
      - "127.0.0.1::9095"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?set a MinIO access key}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?set a MinIO secret key}
      S3_LOKI_URL: http://minio:9000
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /data/loki-data && \
        mkdir -p /data/loki-ruler && \
        minio server /data
    environment:
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?set a MinIO access key}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?set a MinIO secret key}
      - MINIO_PROMETHEUS_AUTH_TYPE=private
      - MINIO_UPDATE=off
    ports:
      - "127.0.0.1::9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis-state:
    image: redis:7.4-alpine
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set a Redis password}
    command: ["sh", "-c", "redis-server --requirepass \"$${REDIS_PASSWORD}\" --appendonly yes"]
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6

  dapr-placement:
    image: "daprio/dapr:1.14.4"
    container_name: dapr_placement
    command: ["./placement", "-port", "50006"]
    ports:
      - "127.0.0.1::50006"

  rabbit:
    image: rabbitmq:3.13-management-alpine
    container_name: pubsub_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set a RabbitMQ user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set a RabbitMQ password}
    ports:
      - "127.0.0.1::5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 6

  database:
    image: postgres:17-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a PostgreSQL password}
      POSTGRES_DB: ${POSTGRES_DB:-openmu}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    ports:
      - "127.0.0.1::5432"
    volumes:
      - dbdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\""]
      interval: 10s
      timeout: 5s
      retries: 6

  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: tracing_zipkin
    restart: always
    ports:
      # WEB-11: bind to loopback only; public access goes through nginx /zipkin with basic auth.
      - "127.0.0.1:9411:9411"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9411/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  connectServer:
    image: munique/openmu-connect:0.9.10
    container_name: connectServer
    ports:
      # 44405 is the public game-client connect port; inter-server (50001) and
      # metrics (9464) stay on loopback and are reached over the docker network.
      - "127.0.0.1::50001"
      - "44405:44405"
      - "127.0.0.1::9464" # Prometheus
    environment:
      APPID: connectServer
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      rabbit:
        condition: service_healthy
      zipkin:
        condition: service_started
      database:
        condition: service_healthy

  connectServer-dapr:
    image: "daprio/daprd:1.14.4"
    container_name: connectServer_dapr
    command: [ "./daprd", "-app-id", "connectServer", "-app-port", "8080",
                "-components-path", "/components",
                "-config", "/components/config.yaml",
                "-placement-host-address", "dapr-placement:50006"  ]
    environment:
      # Expanded by daprd for the ${{REDIS_PASSWORD}} placeholder in the
      # login-state component (the stack fails fast when it is not provided).
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set a Redis password}
      RABBITMQ_USER: ${RABBITMQ_USER:?set a RabbitMQ user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set a RabbitMQ password}
    depends_on:
      connectServer:
        condition: service_started
    network_mode: "service:connectServer"
    volumes:
      - "./dapr-components/:/components"

  loginServer:
    image: munique/openmu-login:0.9.10
    container_name: loginServer
    ports:
      - "127.0.0.1::50001"
      - "127.0.0.1::9464" # Prometheus
    environment:
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      zipkin:
        condition: service_started
      database:
        condition: service_healthy

  loginServer-dapr:
    image: "daprio/daprd:1.14.4"
    container_name: loginServer_dapr
    command: [ "./daprd", "-app-id", "loginServer", "-app-port", "8080",
                "-components-path", "/components",
                "-config", "/components/config.yaml",
                "-placement-host-address", "dapr-placement:50006"  ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set a Redis password}
      RABBITMQ_USER: ${RABBITMQ_USER:?set a RabbitMQ user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set a RabbitMQ password}
    depends_on:
      loginServer:
        condition: service_started
    network_mode: "service:loginServer"
    volumes:
      - "./dapr-components/:/components"

  friendServer:
    image: munique/openmu-friend:0.9.10
    container_name: friendServer
    ports:
      - "127.0.0.1::50001"
      - "127.0.0.1::9464" # Prometheus
    environment:
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      chatServer-dapr:
        condition: service_started
      database:
        condition: service_healthy
      zipkin:
        condition: service_started

  friendServer-dapr:
    image: "daprio/daprd:1.14.4"
    container_name: friendServer_dapr
    command: [ "./daprd", "-app-id", "friendServer", "-app-port", "8080",
                "-components-path", "/components",
                "-config", "/components/config.yaml",
                "-placement-host-address", "dapr-placement:50006"  ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set a Redis password}
      RABBITMQ_USER: ${RABBITMQ_USER:?set a RabbitMQ user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set a RabbitMQ password}
    depends_on:
      friendServer:
        condition: service_started
    network_mode: "service:friendServer"
    volumes:
      - "./dapr-components/:/components"
  
  guildServer:
    image: munique/openmu-guild:0.9.10
    container_name: guildServer
    ports:
      - "127.0.0.1::50001"
      - "127.0.0.1::9464" # Prometheus
    environment:
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      database:
        condition: service_healthy
      zipkin:
        condition: service_started

  guildServer-dapr:
    image: "daprio/daprd:1.14.4"
    container_name: guildServer_dapr
    command: [ "./daprd", "-app-id", "guildServer", "-app-port", "8080",
                "-components-path", "/components",
                "-config", "/components/config.yaml",
                "-placement-host-address", "dapr-placement:50006"  ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set a Redis password}
      RABBITMQ_USER: ${RABBITMQ_USER:?set a RabbitMQ user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set a RabbitMQ password}
    depends_on:
      guildServer:
        condition: service_started
    network_mode: "service:guildServer"
    volumes:
      - "./dapr-components/:/components"

  chatServer:
    image: munique/openmu-chat:0.9.10
    container_name: chatServer
    environment:
      APPID: chatServer
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "55980:55980"
      - "127.0.0.1::50001"
      - "127.0.0.1::9464" # Prometheus
    depends_on:
      database:
        condition: service_healthy
      zipkin:
        condition: service_started

  chatServer-dapr:
    image: "daprio/daprd:1.14.4"
    container_name: chatServer_dapr
    command: [ "./daprd", "-app-id", "chatServer", "-app-port", "8080",
                "-components-path", "/components",
                "-config", "/components/config.yaml",
                "-placement-host-address", "dapr-placement:50006"  ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set a Redis password}
      RABBITMQ_USER: ${RABBITMQ_USER:?set a RabbitMQ user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set a RabbitMQ password}
    depends_on:
      chatServer:
        condition: service_started
    network_mode: "service:chatServer"
    volumes:
      - "./dapr-components/:/components"


  adminPanel:
    image: munique/openmu-admin:0.9.10
    container_name: adminPanel
    depends_on:
      database:
        condition: service_healthy
    ports:
      # The panel must only be reachable through nginx (/admin, IP allowlist);
      # do not publish it directly. Metrics stay loopback-only as well.
      - "127.0.0.1::8080"
      - "127.0.0.1::9464" # Prometheus
    environment:
      ASPNETCORE_URLS: http://+:8080
      PATH_BASE: /admin/
      # Bootstrap admin panel user. Compose refuses to start when it is unset or empty,
      # so the panel can never be reachable without a login (run deploy/quick-start first).
      OPENMU_ADMIN_USER: ${OPENMU_ADMIN_USER:?Run deploy/quick-start to create an admin user}
      OPENMU_ADMIN_PASSWORD: ${OPENMU_ADMIN_PASSWORD:?Run deploy/quick-start to create an admin user}
      # Optional base32 TOTP secret, if the bootstrap user should require a second factor.
      OPENMU_ADMIN_TOTP_SECRET: ${OPENMU_ADMIN_TOTP_SECRET:-}
      # website authenticates itself at the public API under /api.
    volumes:
      - adminpanel-keys:/app/data-protection-keys

  adminPanel-dapr:
    image: "daprio/daprd:1.14.4"
    container_name: adminPanel_dapr
    command: [ "./daprd", "-app-id", "adminPanel", "-app-port", "8080",
                "-components-path", "/components",
                "-config", "/components/config.yaml",
                "-placement-host-address", "dapr-placement:50006"  ]

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set a Redis password}
      RABBITMQ_USER: ${RABBITMQ_USER:?set a RabbitMQ user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set a RabbitMQ password}
    depends_on:
      adminPanel:
        condition: service_started
    network_mode: "service:adminPanel"
    volumes:
      - "./dapr-components/:/components"

  gameServer0:
    image: munique/openmu-game:0.9.10
    container_name: gameServer0
    build:
      context: ../../src
      dockerfile: Dapr/GameServer.Host/Dockerfile
    ports:
      - "127.0.0.1::8080"
      - "127.0.0.1::50001"
      - "55901:55901"
      - "55902:55902"
      - "127.0.0.1::9464" # Prometheus
    environment:
      GS_ID: 0
      APPID: gameServer0
      PATH_BASE: /gameServer/0/
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      connectServer-dapr:
        condition: service_started
      loginServer-dapr:
        condition: service_started
      friendServer-dapr:
        condition: service_started
      rabbit:
        condition: service_healthy
      zipkin:
        condition: service_started
      database:
        condition: service_healthy
      loki:
        condition: service_healthy

  gameServer0-dapr:
    image: "daprio/daprd:1.14.4"
    container_name: gameserver0_dapr
    command: [ "./daprd", "-app-id", "gameServer0", "-app-port", "8080",
                "-components-path", "/components",
                "-config", "/components/config.yaml",
                "-placement-host-address", "dapr-placement:50006"  ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set a Redis password}
      RABBITMQ_USER: ${RABBITMQ_USER:?set a RabbitMQ user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set a RabbitMQ password}
    depends_on:
      gameServer0:
        condition: service_started
    network_mode: "service:gameServer0"
    volumes:
      - "./dapr-components/:/components"
  
  gameServer1:
    image: munique/openmu-game:0.9.10
    container_name: gameServer1
    build:
      context: ../../src
      dockerfile: Dapr/GameServer.Host/Dockerfile
    ports:
      - "127.0.0.1::8080"
      - "127.0.0.1::50001"
      - "55903:55903"
      - "55904:55904"
      - "127.0.0.1::9464" # Prometheus
    environment:
      GS_ID: 1
      APPID: gameServer1
      PATH_BASE: /gameServer/1/
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      connectServer-dapr:
        condition: service_started
      loginServer-dapr:
        condition: service_started
      friendServer-dapr:
        condition: service_started
      rabbit:
        condition: service_healthy
      zipkin:
        condition: service_started
      database:
        condition: service_healthy
      loki:
        condition: service_healthy

  gameServer1-dapr:
    image: "daprio/daprd:1.14.4"
    container_name: gameserver1_dapr
    command: [ "./daprd", "-app-id", "gameServer1", "-app-port", "8080",
                "-components-path", "/components",
                "-config", "/components/config.yaml",
                "-placement-host-address", "dapr-placement:50006"  ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set a Redis password}
      RABBITMQ_USER: ${RABBITMQ_USER:?set a RabbitMQ user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set a RabbitMQ password}
    depends_on:
      gameServer1:
        condition: service_started
    network_mode: "service:gameServer1"
    volumes:
      - "./dapr-components/:/components"
