events {
}

http {
    # this is required to proxy Grafana Live WebSocket connections.
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }

  server {
    listen 80;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    resolver 127.0.0.11 ipv6=off;

    location /zipkin {
       auth_basic "Zipkin";
       auth_basic_user_file /etc/nginx/.htpasswd;
       proxy_pass http://zipkin:9411/zipkin/;
    }

    location /grafana/ {
        proxy_set_header Host $http_host;
        proxy_pass http://grafana:3000/;

        # Auth by nginx
        auth_basic "Grafana";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_set_header X-WEBAUTH-USER $remote_user;
        proxy_set_header Authorization "";
    }
    
    # Proxy Grafana Live WebSocket connections.
    location /grafana/api/live {
        rewrite  ^/grafana/(.*)  /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;

        proxy_pass http://grafana:3000/;

        # Auth by nginx
        auth_basic "Grafana";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_set_header X-WEBAUTH-USER $remote_user;
        proxy_set_header Authorization "";
    }

    location ~ (/admin)(.*) {
       # Restrict the admin panel to private networks; edit this list for your VPN.
       # A proxy_set_header directive at location level disables inheritance of the
       # server-level headers, so the WebSocket Upgrade/Connection pair must be repeated
       # here (the Blazor circuit depends on it).
       allow 10.0.0.0/8;
       allow 172.16.0.0/12;
       allow 192.168.0.0/16;
       deny all;
       proxy_set_header Upgrade $http_upgrade;
       proxy_set_header Connection "upgrade";
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;
       proxy_set_header X-Forwarded-Host $host;
       proxy_pass http://adminPanel:8080/admin$2;
    }

    # Public API
    location ~ (/serverInfo)(.*) {
       proxy_pass http://connectServer:8080/serverInfo$2;
    }

    # Game Servers: the live-map monitoring UI must not be world-reachable. The service now
    # requires loopback / a valid APP_API_TOKEN for every non-public endpoint (including Razor
    # pages and Blazor circuits), so unauthorized requests are rejected there; this adds a second
    # layer: restrict the location to private networks and keep only GET/HEAD. Administrative
    # operations (disconnect / temporarily ban) are rendered only for authenticated admins.
    location ~ (/gameServer/(\d+)(.*)) {
       allow 10.0.0.0/8;
       allow 172.16.0.0/12;
       allow 192.168.0.0/16;
       deny all;
       limit_except GET HEAD {
           deny all;
       }
       proxy_set_header Upgrade $http_upgrade;
       proxy_set_header Connection "upgrade";
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;
       proxy_set_header X-Forwarded-Host $host;
       proxy_pass http://gameServer$2:8080$1;
    }
  }
}