name: Documentation website

# DEP-015: explicit least-privilege permissions (defaults to read-write if omitted).
permissions:
  contents: read

on:
  push:
    branches:
      - master
    paths:
      - 'docs-website/**'
      - '.github/workflows/docs-website.yml'
  pull_request:
    paths:
      - 'docs-website/**'
      - '.github/workflows/docs-website.yml'

jobs:
  build:
    name: Build the documentation site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-website

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup NodeJS
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The build is configured to fail on broken links, broken anchors and
      # broken image references, so this is the link check as well.
      - name: Build
        run: npm run build
